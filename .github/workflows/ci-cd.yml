name: Phase 3 - CI/CD (cache, scan, push to ECR)

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

  pull_request:
    branches: ["master"]

env:
  IMAGE_NAME: docker-mastery-demo
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: docker-mastery-demo

jobs:

  # =========================================================
  # 1. LINT + UNIT TEST
  # =========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app test_main.py --max-line-length=100

      - name: Run tests
        run: pytest -v


  # =========================================================
  # 2. BUILD + SCAN + PUSH TO AMAZON ECR
  # =========================================================
  build-scan-push:
    name: Build, Scan & Push
    needs: lint-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Calculate Docker image tags
      # -------------------------------------------------------
      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          echo "sha_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi


      # -------------------------------------------------------
      # Setup Docker Buildx
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -------------------------------------------------------
      # Build Docker image with GitHub Actions cache
      # -------------------------------------------------------
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # -------------------------------------------------------
      # Scan Docker image with Trivy
      # -------------------------------------------------------
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      # -------------------------------------------------------
      # Configure AWS credentials
      # -------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------------------------------------
      # Login to Amazon ECR
      # -------------------------------------------------------
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # -------------------------------------------------------
      # Tag and push image to Amazon ECR
      # -------------------------------------------------------
      - name: Tag & push to Amazon ECR
        run: |
          ECR_REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          echo "ECR Repository: $ECR_REPO"

          # Tag image with commit SHA
          docker tag \
            "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}" \
            "$ECR_REPO:${{ steps.meta.outputs.sha_tag }}"

          # Tag image as latest
          docker tag \
            "${{ env.IMAGE_NAME }}:latest" \
            "$ECR_REPO:latest"

          # Push SHA-tagged image
          docker push \
            "$ECR_REPO:${{ steps.meta.outputs.sha_tag }}"

          # Push latest image
          docker push \
            "$ECR_REPO:latest"

          # Push version tag if triggered by a Git tag
          if [ -n "${{ steps.meta.outputs.version_tag }}" ]; then

            echo "Pushing version tag: ${{ steps.meta.outputs.version_tag }}"

            docker tag \
              "${{ env.IMAGE_NAME }}:latest" \
              "$ECR_REPO:${{ steps.meta.outputs.version_tag }}"

            docker push \
              "$ECR_REPO:${{ steps.meta.outputs.version_tag }}"

          fi
